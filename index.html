let users={},logs=[],reqs={},settings=null,me=null,hasUsers=true,off=0,tick=null,loaded=false,last='',lastOk=0,offline=false,pending='';

const sv=v=>{tok=v;try{v?localStorage.setItem('k4t',v):localStorage.removeItem('k4t')}catch(e){}};
const now=()=>Date.now()+off,cur=()=>me&&users[me]?{id:me,...users[me]}:null;
const isExp=u=>u.passType==='temp'&&u.expiry&&now()>=u.expiry;
const exp24=u=>u.passType==='temp'&&u.expiry&&!isExp(u)&&u.expiry-now()<864e5;
const fmt=ms=>{if(ms<=0)return'00:00:00';const s=Math.floor(ms/1e3),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return(d?d+'d ':'')+[h,m,s%60].map(x=>String(x).padStart(2,'0')).join(':')};
const dt=ms=>new Date(ms).toLocaleString([],{dateStyle:'medium',timeStyle:'short'});
const luhn=s=>{if(!/^\d{15}$/.test(s))return false;let n=0;for(let i=0;i<15;i++){let x=+s[14-i];if(i%2){x*=2;if(x>9)x-=9}n+=x}return n%10===0};
async function api(fn,a={}){
  let r;try{r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({fn,a})})}catch(e){throw new Error('No internet connection.')}
  const j=await r.json().catch(()=>null);if(!j)throw new Error('Server error ('+r.status+')');
  if(!j.ok)throw new Error(j.error);return j.data}
const updTxt=()=>offline?'Offline – showing last data':lastOk?'Updated '+new Date(lastOk).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';
async function load(force){
  if(!force&&loaded&&['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;
  try{
    if(tok){const r=await api('k4_get',{p_token:tok});off=r.now-Date.now();me=r.me;users=r.users;logs=r.log||[];reqs=r.reqs||{};settings=r.settings;hasUsers=true}
    else if(!loaded||force){hasUsers=await api('k4_state');users={};me=null;logs=[];reqs={}}
    lastOk=Date.now();offline=false;
  }catch(e){
    if(tok&&/Session expired|account was removed/.test(e.message)){sv(null);pending=e.message;last='';return load(true)}
    if(!loaded){$('#app').innerHTML='<div class="card err">Cannot reach the database: '+E(e.message)+'</div>';return}
    offline=true;const el=g('upd');if(el)el.textContent=updTxt();return}
  const el=g('upd');if(el)el.textContent=updTxt();
  const sig=JSON.stringify([users,hasUsers,me,settings,logs,reqs,Math.floor(now()/6e4)]);if(loaded&&sig===last)return;last=sig;loaded=true;render()}
async function refresh(){await load(true);toast('Up to date')}
async function act(fn,a,ok){try{const r=await api(fn,{p_token:tok,...a});await load(true);if(ok)toast(ok);return r}
  catch(e){if(/Session expired|account was removed/.test(e.message)){sv(null);pending=e.message;last='';return load(true)}toast(e.message,true)}}

function render(){
  clearInterval(tick);const u=cur();document.body.classList.toggle('adm',!!u&&u.role==='admin');
  if(!u){$('#app').innerHTML=loginView()}
  else if(!MOBILE&&u.role!=='admin'){$('#app').innerHTML=`<header><h1>${brand()}</h1>${langSel()}</header><div class="card gate"><div class="ico">📱</div><h2>${t('mobOnly')}</h2><p class="mut">${t('mobTxt')}</p><button class="s" onclick="logout()">${t('logout')}</button></div>`}
  else{const A=u.role==='admin';
    $('#app').innerHTML=`<header><h1>${brand()}</h1><div class="hr"><span class="mut">${E(u.name)}</span><span class="badge">${A?'Admin':'User'}</span>${A?'':langSel()}<button class="ib" onclick="toggleTheme()" aria-label="Theme">🌓</button></div></header>
    <div class="mut" style="margin-bottom:10px"><span id="upd">${updTxt()}</span> <button class="lnk" onclick="refresh()">⟳ Refresh</button></div>`
    +(A?adminView(u)+tabBar():userView(u)+`<div class="row" style="margin-top:8px"><button class="s" onclick="logout()">${t('logout')}</button></div>`);
    tick=setInterval(updClocks,1000);updClocks()}

  if(lg.step==='recover')return head+`<div class="card"><h2 style="margin-top:0">Admin recovery</h2><p class="mut">Only for the owner. Enter the RECOVERY_KEY saved in Cloudflare, then choose a new PIN.</p>

async function nextId(idArg){const id=(typeof idArg==='string'?idArg:val('lid')).trim().toUpperCase();if(!id)return lerr(t('needId'));

const U=()=>Object.entries(users).filter(([,u])=>u.role==='user');

const pendN=()=>Object.keys(reqs).length+resets().length+devReqs().length+waitingPass().length;
const TABS=[['home','🏠','Home'],['users','👥','Users'],['req','🔔','Requests'],['log','📜','Log']];
const tabBar=()=>`<nav class="tabs">${TABS.map(([k,i,n])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"><span>${i}</span>${n}${k==='req'&&pendN()?`<i class="dot">${pendN()}</i>`:''}</button>`).join('')}</nav>`;

function ulist(){

  <select id="n_${id}">${[1,2,3,4,5].map(n=>`<option value="${n}"${n==(u.count||1)?' selected':''}>${n} pass${n>1?'es':''}</option>`).join('')}</select></div>

  <div class="row"><button class="sm" onclick="approve('${id}')">${u.passType==='none'?'Approve':'Update'} pass</button>${u.passType!=='none'?`<button class="sm d" onclick="revoke('${id}')">Revoke</button>`:''}</div>
  ${u.passType==='temp'?`<div class="row" style="margin-top:8px"><button class="sm s" onclick="ext('${id}',24)">+1 day</button><button class="sm s" onclick="ext('${id}',168)">+1 week</button></div>`:''}
  <div class="row" style="margin-top:8px"><button class="sm s" onclick="promote('${id}')">Make Admin</button><button class="sm s" onclick="delUser('${id}')">Delete</button></div></div>`;

function csv(){
  const q2=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['Name','Login ID','PIN Set','Pass Type','Passes Allowed','Devices Added','Valid Until','Status','Approved By','Approved At','Device Models','IMEIs','Mobile Numbers']];
  U().forEach(([id,u])=>{const dv=(u.devices||[]).filter(Boolean);rows.push([u.name,id,u.pinSet?'Yes':'No',u.passType==='none'?'No pass':u.passType==='temp'?'Temporary':'Permanent',u.count||0,dv.length,u.passType==='temp'&&u.expiry?dt(u.expiry):u.passType==='perm'?'Permanent':'',u.passType==='none'?'':isExp(u)?'Expired':'Active',u.approvedBy||'',u.approvedAt?dt(u.approvedAt):'',dv.map(d=>d.model).join(' | '),dv.map(d=>"'"+d.imei).join(' | '),dv.map(d=>d.num||'').join(' | ')])});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(q2).join(',')).join('\n')],{type:'text/csv'}));a.download='mobile-pass-k4-users.csv';document.body.appendChild(a);a.click();a.remove()}

/* ---------- USER ---------- */
function userView(u){
  if(u.passType==='none')return `<div class="card"><b>${t('noPass')}</b><p class="mut">${t('noPassSub')}</p></div>`;
  const T=u.passType==='temp',x=isExp(u),cls=x?'x':T?'t':'p',dev=u.devices||[];
  let out=T&&!x&&u.expiry-now()<36e5?`<div class="card warn2">⏰ ${t('low')} <b class="lt" data-exp="${u.expiry}"></b></div>`:'';
  for(let i=0;i<u.count;i++){const d=dev[i],req=(u.devReq||{})[i];
    out+=`<div class="pass ${cls}"><div class="ptop">${passLogo()}<b>${T?t('tempL'):t('permL')}</b></div>
    <h3>${T?t('tempT'):t('permT')}</h3><small>${t('passOf',i+1,u.count)}</small>
    <div class="who"><small>${t('holder')}</small><div class="big">${E(u.name)}</div><div class="idl">${E(u.id||'')}</div></div>
    <div class="apr"><div><small>${t('appr')}</small><div class="big2">${E(u.approvedBy||'-')}</div>${u.approvedAt?`<small style="text-transform:none">${dt(u.approvedAt)}</small>`:''}</div>
    <div class="stamp${x?' bad':''}">${x?t('exp'):'✔ '+t('stampOk')}${u.approvedAt?`<small>${new Date(u.approvedAt).toLocaleDateString([],{day:'2-digit',month:'short',year:'numeric'})}</small>`:''}</div></div>
    <div class="live"><i></i><span class="nowc"></span></div>
    ${T?`<div class="clock" data-exp="${u.expiry}">--:--:--</div><div class="kv"><span>${t('upto')}</span><b>${dt(u.expiry)}</b></div>`:`<div class="kv"><span>${t('validity')}</span><b>${t('perm')}</b></div>`}
    ${d?`<div class="kv"><span>${t('dev')}</span><b>${E(d.model)}</b></div><div class="kv"><span>${t('imei')}</span><b>${E(d.imei)}</b></div><div class="kv"><span>${t('mob')}</span><b>${E(d.num||'-')}</b></div><div class="kv"><span>${t('plat')}</span><b>${E(d.os||'-')}</b></div>`
      +(x?'':req?`<p class="mut2">⏳ ${t('lostSent')}</p>`:`<button class="sm s" style="width:100%;margin-top:10px" onclick="lostDev(${i})">${t('lost')}</button>`)
    :(x?`<p>${t('expN')}</p>`:`<p style="margin:10px 0 4px"><b>${t('addFor',i+1)}</b></p>
      <input id="dm${i}" placeholder="${t('model')}" value="${E(guess())}"><input id="di${i}" inputmode="numeric" maxlength="15" placeholder="${t('imeiPh')}"><input id="dn${i}" inputmode="tel" placeholder="${t('numPh')}">
      <button style="width:100%;background:#fff;color:#111" onclick="addDev(${i})">${t('save')}</button>`)}</div>`}
  return out+`<p class="mut">${t('help')}</p>${standalone()?'':`<p class="mut">${t('install')}</p>`}`;
}
function guess(){const m=navigator.userAgent.match(/\(([^)]+)\)/);return m?m[1].split(';').slice(-1)[0].trim().replace(/ Build.*/,''):''}
function addDev(i){const m=val('dm'+i).trim(),im=val('di'+i).replace(/\D/g,'');
  if(!m)return toast(t('enterModel'),true);if(!luhn(im))return toast(t('imeiBad'),true);
  act('k4_add_device',{p_idx:i,p_model:m,p_imei:im,p_num:val('dn'+i).trim(),p_os:navigator.platform||'Mobile'})}
async function lostDev(i){if(await ask(t('lost'),t('lostQ'),t('yes'),false,t('cancel')))act('k4_report_lost',{p_idx:i},t('lostSent'))}

/* ---------- start ---------- */
function startApp(){
  applyTheme();document.documentElement.lang=lang;
  if(!API_URL){$('#app').innerHTML='<div class="card err">Setup needed: paste your API link into this file (see README).</div>';return}
  load(true);setInterval(()=>{if(tok&&!document.hidden)load()},45000);
  document.addEventListener('visibilitychange',()=>{if(tok&&!document.hidden)load()})}
startApp();
</script></body></html>
